; Minimal XUnity.AutoTranslator config. Replace xx with your pack's language code
; (the same code as the folder name below BepInEx/Translation).
; All other options keep the plugin defaults.
[Service]
Endpoint=NullTranslator
FallbackEndpoint=

[General]
Language=xx
FromLanguage=en

[Files]
Directory=Translation\{Lang}\Text
OutputFile=Translation\{Lang}\Text\_AutoGeneratedTranslations.txt

[Behaviour]
EnableSilentMode=True

[Texture]
TextureDirectory=Translation\{Lang}\Texture
