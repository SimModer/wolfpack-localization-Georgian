name: Language request
description: Request a new language or offer to maintain one
labels: [new-language]
body:
  - type: input
    id: lang
    attributes:
      label: Language
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Will you translate it yourself?
      options:
        - "Yes"
        - Only partly / need help
        - No, just a request
