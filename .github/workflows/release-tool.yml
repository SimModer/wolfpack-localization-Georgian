name: Release tool
on:
  push:
    tags: ["tool-v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: |
          cmake -S tool -B tool/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build tool/build
      - uses: softprops/action-gh-release@v2
        with:
          files: tool/build/WolfpackL10n.exe
